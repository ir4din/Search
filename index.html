<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>سامانه جستجوی دانش‌آموزان و کلاس‌ها</title>
  <meta name="theme-color" content="#0d1117" />
  <style>
    @font-face {
      font-family: 'Estedad';
      src: url('fonts/Estedad-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-dark: #080b14;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-bg-hover: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-focus: rgba(99, 102, 241, 0.6);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --accent-primary: #6366f1;
      --accent-secondary: #a855f7;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --badge-bg: rgba(99, 102, 241, 0.2);
      --badge-border: rgba(129, 140, 248, 0.35);
      --badge-text: #c7d2fe;
      --highlight-bg: rgba(234, 179, 8, 0.3);
      --highlight-text: #fef08a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Estedad', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(12px, 3vw, 32px);
      padding-top: max(clamp(12px, 3vw, 32px), env(safe-area-inset-top));
      padding-bottom: max(clamp(16px, 4vw, 36px), env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Animated Aurora Background Orbs */
    .background-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: float 20s infinite alternate ease-in-out;
    }

    .blob-1 {
      top: -10%;
      right: -10%;
      width: clamp(280px, 45vw, 550px);
      height: clamp(280px, 45vw, 550px);
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      animation-duration: 18s;
    }

    .blob-2 {
      bottom: -15%;
      left: -15%;
      width: clamp(300px, 50vw, 600px);
      height: clamp(300px, 50vw, 600px);
      background: radial-gradient(circle, #a855f7 0%, rgba(168, 85, 247, 0) 70%);
      animation-duration: 24s;
      animation-delay: -5s;
    }

    .blob-3 {
      top: 40%;
      left: 20%;
      width: clamp(200px, 35vw, 450px);
      height: clamp(200px, 35vw, 450px);
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      animation-duration: 22s;
      animation-delay: -10s;
      opacity: 0.4;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, 30px) scale(1.08);
      }

      100% {
        transform: translate(-30px, 50px) scale(0.95);
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0 auto;
    }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      padding: clamp(20px, 5vw, 32px);
      transition: border-color 0.3s ease;
    }

    /* Header & Logo */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      padding: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo-container:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.35);
    }

    .school-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .logo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
    }

    .logo-fallback svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.5));
    }

    .app-title {
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: clamp(0.85rem, 2.8vw, 0.95rem);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.8rem;
      color: #e2e8f0;
      margin-top: 4px;
    }

    .stats-badge span {
      color: #38bdf8;
      font-weight: 700;
    }

    /* Search Section */
    .search-wrapper {
      position: relative;
      margin-top: 14px;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .search-input {
      width: 100%;
      height: 56px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--glass-border);
      border-radius: 18px;
      padding: 0 48px 0 46px;
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .search-wrapper:focus-within .search-icon {
      color: var(--accent-primary);
    }

    .clear-btn {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .clear-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Search Results Info */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 2px 6px;
      margin-top: 8px;
      min-height: 24px;
    }

    .results-count {
      font-weight: 500;
    }

    .results-count b {
      color: #38bdf8;
      font-weight: 700;
    }

    /* Results List */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .results-container::-webkit-scrollbar {
      width: 6px;
    }

    .results-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .results-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* Student Item Card */
    .student-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .student-item:hover,
    .student-item:active {
      background: var(--glass-bg-hover);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      width: 100%;
    }

    .student-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35));
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .student-name {
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
      flex: 1;
      min-width: 0;
    }

    .class-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(168, 85, 247, 0.15));
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      font-size: clamp(0.78rem, 2.5vw, 0.86rem);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-start;
      margin-inline-start: 54px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 480px) {
      .class-badge {
        margin-inline-start: 0;
        font-size: 0.78rem;
        padding: 5px 12px;
      }

      .student-item {
        padding: 13px 14px;
        gap: 8px;
      }
    }

    .class-badge-icon {
      width: 14px;
      height: 14px;
      opacity: 0.85;
    }

    .highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
      padding: 1px 3px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Empty / Initial States */
    .empty-state {
      text-align: center;
      padding: 42px 20px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state svg {
      width: 54px;
      height: 54px;
      color: var(--text-dim);
      stroke-width: 1.5;
    }

    .empty-state-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .empty-state-desc {
      font-size: 0.88rem;
      color: var(--text-dim);
      max-width: 320px;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* Touch Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 10px 10px 24px;
      }

      .glass-card {
        border-radius: 22px;
        padding: 18px 14px;
      }

      .search-input {
        height: 52px;
        font-size: 0.95rem;
      }

      .student-item {
        padding: 12px 14px;
      }

      .student-avatar {
        width: 38px;
        height: 38px;
        font-size: 0.85rem;
      }

      .class-badge {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>

        else if (ch === 'ك') ch = 'ک';
        else if (ch === 'ۀ' || ch === 'ة') ch = 'ه';
        else if (ch === 'أ' || ch === 'إ' || ch === 'ٱ' || ch === 'آ') ch = 'ا';
        else if (ch === 'ؤ') ch = 'و';
        else if (ch === 'ئ') ch = 'ی';
        else {
          const d = arabicDigits.indexOf(ch);
          if (d !== -1) ch = String(d);
        }
        // Skip zero-width and control/invisible characters
        const code = ch.codePointAt(0);
        if (code === 0x200b || code === 0x200c || code === 0x200d || code === 0x200e ||
          code === 0x200f || code === 0xfeff || code === 0x0640) {
          continue; // removed from normalized text (no map entry)
        }
        ch = ch.toLowerCase();
        if (/\s/.test(ch)) ch = ' ';
        out += ch;
        map.push(i);
      }
      return { norm: out, map: map };
    }

    function highlightMatch(text, query) {
      if (text == null) return '';
      text = String(text);
      const q = String(query || '').trim();
      if (!q) return escapeHTML(text);

      const { norm, map } = normalizeWithMap(text);
      const tokens = normalizeWithMap(q).norm.split(' ').filter(t => t.length > 0);
      if (!tokens.length || !norm) return escapeHTML(text);

      // Collect matched ranges in ORIGINAL string indices
      const ranges = [];
      tokens.forEach(token => {
        let start = 0;
        let idx;
        while ((idx = norm.indexOf(token, start)) !== -1) {
          const from = map[idx];
          const to = map[idx + token.length - 1];
          if (from !== undefined && to !== undefined) ranges.push([from, to + 1]);
          start = idx + 1;
        }
      });
      if (!ranges.length) return escapeHTML(text);

      // Merge overlapping ranges
      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [ranges[0].slice()];
      for (let i = 1; i < ranges.length; i++) {
        const last = merged[merged.length - 1];
        if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
        else merged.push(ranges[i].slice());
      }

      // Build highlighted HTML, escaping everything
      let html = '', pos = 0;
      merged.forEach(([s, e]) => {
        html += escapeHTML(text.slice(pos, s));
        html += '<mark class="highlight">' + escapeHTML(text.slice(s, e)) + '</mark>';
        pos = e;
      });
      html += escapeHTML(text.slice(pos));
      return html;
    }

    function renderInitialState() {
      resultsCount.innerHTML = 'همه دانش‌آموزان (<b>' + dataset.length + '</b> نفر)';
      renderList(dataset.slice(0, 30), false);
    }

    function renderList(items, isSearching) {
      if (items.length === 0) {
        resultsContainer.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
            <div class="empty-state-title">دانش‌آموزی با این مشخصات یافت نشد</div>
            <div class="empty-state-desc">لطفاً املای نام یا نام خانوادگی را بررسی کرده و مجدداً امتحان کنید.</div>
          </div>
        `;
        return;
      }

      const html = items.map((item, idx) => {
        const queryText = isSearching ? searchInput.value : '';
        const initial = (item.lastName.trim().charAt(0) || item.firstName.trim().charAt(0) || '•');
        const highlightedName = highlightMatch(`${item.firstName} ${item.lastName}`, queryText);
        const highlightedClass = highlightMatch(item.className, queryText);
        return `
          <div class="student-item" style="animation-delay: ${Math.min(idx * 0.02, 0.3)}s">
            <div class="student-info">
              <div class="student-avatar">${initial}</div>
              <div class="student-name">${highlightedName}</div>
            </div>
            <div class="class-badge">
              <svg class="class-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>
              ${highlightedClass}
            </div>
          </div>
        `;
      }).join('');

      resultsContainer.innerHTML = html;
    }

    function performSearch() {
      const query = searchInput.value;
      const normQuery = normalize(query);

      if (normQuery.length > 0) {
        clearBtn.style.display = 'flex';
      } else {
        clearBtn.style.display = 'none';
        renderInitialState();
        return;
      }

      const queryTokens = normQuery.split(' ').filter(t => t.length > 0);

      const filtered = dataset.filter(item => {
        return queryTokens.every(token =>
          item.normFull.includes(token) ||
          item.normReverse.includes(token) ||
          item.normClass.includes(token)
        );
      });

      resultsCount.innerHTML = `تعداد نتایج: <b>${filtered.length}</b> دانش‌آموز`;
      renderList(filtered, true);
    }

    searchInput.addEventListener('input', performSearch);

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      performSearch();
    });

    // Initialize list on load
    renderInitialState();
  </script>
</body>

</html>
